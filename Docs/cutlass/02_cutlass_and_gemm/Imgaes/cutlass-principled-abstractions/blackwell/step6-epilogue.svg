<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800"><defs><marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker><marker id="arrow-memory" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker><marker id="arrow-compute" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker><marker id="arrow-control" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker><marker id="arrow-neutral" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker><marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/></marker></defs><rect x="50" y="35" width="1080" height="62" rx="20" fill="#334155" stroke="#0f172a" stroke-width="2"/><text x="80" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#ffffff">第六步：TMEM Accumulator 经寄存器计算写回 GMEM D</text><g font-family="Noto Sans CJK SC, sans-serif"><path d="M 370 300 L 470 300" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="340.5" y="271" width="159" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="420" y="295" font-size="15" text-anchor="middle" fill="#334155">TMEM Load</text><path d="M 770 300 L 900 425" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="785" y="333.5" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="835" y="357.5" font-size="15" text-anchor="middle" fill="#334155">α×Acc</text><path d="M 770 620 L 900 425" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="785" y="493.5" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="835" y="517.5" font-size="15" text-anchor="middle" fill="#334155">β×C</text><path d="M 1230 425 L 1360 410" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-compute)"/><rect x="1245" y="388.5" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1295" y="412.5" font-size="15" text-anchor="middle" fill="#334155">最终 D</text><path d="M 1510 520 L 1510 600" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1460" y="531" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1510" y="555" font-size="15" text-anchor="middle" fill="#334155">完成后回收</text><rect x="70" y="190" width="300" height="220" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="88" y="233" font-size="25" font-weight="700" fill="#0f172a">TMEM 累加器</text><text x="90" y="276" font-size="19" fill="#1f2937">tCtAcc / tDtAcc</text><text x="90" y="307" font-size="19" fill="#1f2937">完整 K 维归约</text><text x="90" y="338" font-size="19" fill="#1f2937">等待 MMA completion</text><rect x="470" y="190" width="300" height="220" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="488" y="233" font-size="25" font-weight="700" fill="#0f172a">线程局部 Acc Fragment</text><text x="490" y="276" font-size="19" fill="#1f2937">tDrAcc</text><text x="490" y="307" font-size="19" fill="#1f2937">TiledCopy: TMEM → RMEM</text><text x="490" y="338" font-size="19" fill="#1f2937">实际寄存器数值</text><rect x="470" y="520" width="300" height="200" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="488" y="563" font-size="25" font-weight="700" fill="#0f172a">线程局部 C Fragment</text><text x="490" y="606" font-size="19" fill="#1f2937">tDgC → tDrC</text><text x="490" y="637" font-size="19" fill="#1f2937">GMEM C → RMEM C</text><text x="490" y="668" font-size="19" fill="#1f2937">包含 β×C 输入</text><rect x="900" y="300" width="330" height="250" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="918" y="343" font-size="25" font-weight="700" fill="#0f172a">寄存器中执行 AXPBY</text><text x="920" y="386" font-size="19" fill="#1f2937">tDrD = α×tDrAcc + β×tDrC</text><text x="920" y="417" font-size="19" fill="#1f2937">Mainloop Acc 在此形成 D</text><text x="920" y="448" font-size="19" fill="#1f2937">可加入逐元素操作</text><rect x="1360" y="300" width="300" height="220" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1378" y="343" font-size="25" font-weight="700" fill="#0f172a">写回 GMEM D</text><text x="1380" y="386" font-size="19" fill="#1f2937">tDrD → tDgD</text><text x="1380" y="417" font-size="19" fill="#1f2937">RMEM → GMEM</text><text x="1380" y="448" font-size="19" fill="#1f2937">D[133,n] 完成</text><rect x="1360" y="600" width="300" height="150" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1378" y="643" font-size="25" font-weight="700" fill="#0f172a">释放 TMEM</text><text x="1380" y="686" font-size="19" fill="#1f2937">release_allocation_lock()</text><text x="1380" y="717" font-size="19" fill="#1f2937">free(tmem_base_ptr, capacity)</text></g></svg>