ill="#f8fafc" stroke="#94a3b8"/><text x="1720" y="675" font-size="15" text-anchor="middle" fill="#334155">D 写回后回收</text><path d="M 1120 280 L 910 680" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-compute)"/><rect x="943" y="451" width="144" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1015" y="475" font-size="15" text-anchor="middle" fill="#334155">写入同一 Acc</text><path d="M 1470 280 L 1290 680" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1293" y="451" width="174" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1380" y="475" font-size="15" text-anchor="middle" fill="#334155">最后一轮 ready</text><rect x="50" y="190" width="280" height="180" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="68" y="233" font-size="25" font-weight="700" fill="#0f172a">SMEM Buffer 可写</text><text x="70" y="276" font-size="19" fill="#1f2937">上一轮 MMA 已完成</text><text x="70" y="307" font-size="19" fill="#1f2937">当前 phase 可复用</text><rect x="400" y="190" width="300" height="180" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="418" y="233" font-size="25" font-weight="700" fill="#0f172a">TMA 事务进行中</text><text x="420" y="276" font-size="19" fill="#1f2937">登记 expected bytes</text><text x="420" y="307" font-size="19" fill="#1f2937">发射 A/B Copy</text><rect x="770" y="190" width="280" height="180" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="788" y="233" font-size="25" font-weight="700" fill="#0f172a">A/B SMEM 已就绪</text><text x="790" y="276" font-size="19" fill="#1f2937">TMA Barrier 满足</text><text x="790" y="307" font-size="19" fill="#1f2937">Consumer 可以读取</text><rect x="1120" y="190" width="280" height="180" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1138" y="233" font-size="25" font-weight="700" fill="#0f172a">MMA 正在读取</text><text x="1140" y="276" font-size="19" fill="#1f2937">