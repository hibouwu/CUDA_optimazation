ke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="1280" y="281" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1330" y="305" font-size="15" text-anchor="middle" fill="#334155">搬运数值</text><path d="M 740 585 L 1105 430" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="835.5" y="478.5" width="174" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="922.5" y="502.5" font-size="15" text-anchor="middle" fill="#334155">绑定 Barrier</text><path d="M 1105 430 L 1280 585" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1135.5" y="478.5" width="114" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1192.5" y="502.5" font-size="15" text-anchor="middle" fill="#334155">累计完成字节</text><path d="M 1280 585 L 1540 430" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1323" y="478.5" width="174" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1410" y="502.5" font-size="15" text-anchor="middle" fill="#334155">SMEM ready</text><rect x="60" y="190" width="340" height="240" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="78" y="233" font-size="25" font-weight="700" fill="#0f172a">Host 构造 TMA Descriptor</text><text x="80" y="276" font-size="19" fill="#1f2937">GMEM base / Shape / Stride</text><text x="80" y="307" font-size="19" fill="#1f2937">SMEM Box / Swizzle</text><text x="80" y="338" font-size="19" fill="#1f2937">tma_atom_A</text><rect x="500" y="190" width="320" height="240" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="518" y="233" font-size="25" font-weight="700" fill="#0f172a">TMA 源端坐标 View</text><text x="520" y="276" font-size="19" fill="#1f2937">tAgA(_,k_tile)</text><text x="520" y="307" font-size="19" fill="#1f2937">来自 tCgA</text><text x="520" y="338" font-size="19" 