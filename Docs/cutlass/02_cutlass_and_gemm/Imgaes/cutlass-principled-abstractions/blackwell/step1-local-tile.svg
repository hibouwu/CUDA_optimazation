<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="650" viewBox="0 0 1700 650"><defs><marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker><marker id="arrow-memory" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker><marker id="arrow-compute" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker><marker id="arrow-control" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker><marker id="arrow-neutral" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker><marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/></marker></defs><rect x="50" y="35" width="930" height="62" rx="20" fill="#334155" stroke="#0f172a" stroke-width="2"/><text x="80" y="77" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#ffffff">第一步：从完整问题选择当前 MMA Tile 的坐标 View</text><g font-family="Noto Sans CJK SC, sans-serif"><path d="M 410 315 L 525 315" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="417.5" y="286" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="467.5" y="310" font-size="15" text-anchor="middle" fill="#334155">输入坐标域</text><path d="M 875 315 L 990 315" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-compute)"/><rect x="875" y="286" width="115" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="932.5" y="310" font-size="15" text-anchor="middle" fill="#334155">按坐标切片</text><path d="M 1320 315 L 1395 315" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="1307.5" y="286" width="100" height="38" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="1357.5" y="310" font-size="15" text-anchor="middle" fill="#334155">局部坐标</text><rect x="80" y="220" width="330" height="190" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="98" y="263" font-size="25" font-weight="700" fill="#0f172a">完整问题的 A 坐标域</text><text x="100" y="306" font-size="19" fill="#1f2937">mA_tma</text><text x="100" y="337" font-size="19" fill="#1f2937">Shape = (512,384)</text><text x="100" y="368" font-size="19" fill="#1f2937">Engine = TMA coordinate</text><rect x="525" y="205" width="350" height="220" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="543" y="248" font-size="25" font-weight="700" fill="#0f172a">按 MMA 坐标选择 Tile</text><text x="545" y="291" font-size="19" fill="#1f2937">local_tile(...)</text><text x="545" y="322" font-size="19" fill="#1f2937">mma_tiler = (128,256,64)</text><text x="545" y="353" font-size="19" fill="#1f2937">Step&lt;_1,X,_1&gt;</text><rect x="990" y="220" width="330" height="190" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1008" y="263" font-size="25" font-weight="700" fill="#0f172a">当前 A Tile 的坐标 View</text><text x="1010" y="306" font-size="19" fill="#1f2937">gA</text><text x="1010" y="337" font-size="19" fill="#1f2937">Shape = (128,64,6)</text><text x="1010" y="368" font-size="19" fill="#1f2937">不复制 A 的数值</text><rect x="1395" y="220" width="250" height="190" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1413" y="263" font-size="25" font-weight="700" fill="#0f172a">贯穿元素</text><text x="1415" y="306" font-size="19" fill="#1f2937">A[133,70]</text><text x="1415" y="337" font-size="19" fill="#1f2937">m_tile=1, q=1</text><text x="1415" y="368" font-size="19" fill="#1f2937">gA(5,6,1)</text></g></svg>